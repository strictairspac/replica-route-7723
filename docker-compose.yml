name: ${COMPOSE_PROJECT_NAME:-online-index}

services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-online-index}-db
    environment:
      MYSQL_USER: indexdrill
      MYSQL_PASSWORD: ${DB_PASSWORD:-indexdrill_demo_pw}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-indexdrill_demo_pw}
      MYSQL_DATABASE: indexdrill
    ports: ["${DB_PORT:-17747}:3306"]
    volumes: [db-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 3s
      timeout: 3s
      retries: 40

  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-online-index}-backend
    environment: &env
      DATABASE_URL: mysql+pymysql://indexdrill:${DB_PASSWORD:-indexdrill_demo_pw}@db:3306/indexdrill
      JWT_SECRET: ${JWT_SECRET:-local-online-index-change-before-public-use}
      SEED_DEMO: ${SEED_DEMO:-true}
      ARTIFACT_DIR: /artifacts
      WORKER_HEARTBEAT: /tmp/worker-heartbeat
    ports: ["${BACKEND_PORT:-19247}:8000"]
    volumes: [run-artifacts:/artifacts]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-online-index}-worker
    command: [python, -m, src.worker]
    environment: *env
    volumes: [run-artifacts:/artifacts]
    depends_on:
      backend: {condition: service_healthy}
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.path.getmtime('/tmp/worker-heartbeat')<20"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-online-index}-frontend
    ports: ["${FRONTEND_PORT:-18247}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
  run-artifacts:
